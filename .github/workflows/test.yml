name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published, created]  # Run tests when releases are created or published

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build package
        run: uv build

      - name: Install package
        run: uv pip install (Get-ChildItem dist -Filter *.whl | Select-Object -First 1 -ExpandProperty FullName)

      - name: Run tests with coverage (primary report)
        if: matrix.python-version == '3.12'
        run: uv run pytest tests/ -v --cov=Expedition --cov-report=xml
        # Tests will be automatically skipped when DLL is not available.
        # This run also generates coverage.xml for Codecov upload.

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest tests/ -v
        # Skipped tests are considered successful, so no continue-on-error needed.

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  unit-arm64:
    # Unit tests only: they fake ExpDLL and check PE headers from generated bytes, so no
    # Expedition install is needed. Runs on a native ARM64 Windows runner.
    runs-on: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: uv run pytest tests/ -v

  protocol:
    # Pure Python: the simple-protocol module and the fake-DLL unit tests need no Windows and no
    # Expedition install, so they run on Linux as well.
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run protocol and fake-DLL tests
        run: uv run pytest tests/test_protocol.py tests/test_fake_expdll.py tests/test_dll_wrapper_unit.py -v

  integration:
    # Optional. Runs only when the repository variable EXPEDITION_INTEGRATION is "true", on a
    # self-hosted Windows runner labelled "expedition" with Expedition installed. Set
    # EXPEDITION_DLL_DIR to the build folder under test (for example ExpeditionARM).
    if: vars.EXPEDITION_INTEGRATION == 'true'
    runs-on: [self-hosted, windows, expedition]

    env:
      EXPEDITION_DLL_DIR: ${{ vars.EXPEDITION_DLL_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run integration tests against a running Expedition
        run: uv run pytest tests/test_expedition.py -v

  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check code formatting with black
        run: uv run black --check .

      - name: Check import sorting with isort
        run: uv run isort --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy Expedition/
